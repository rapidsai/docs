[project]
name = "rapids-docs"
version = "0.1.0"
description = "NVIDIA RAPIDS documentation portal"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.0",
    "boto3>=1.40.0",
    "html5lib>=1.1",
    "jinja2>=3.1.0",
    "myst-parser>=4.0.0",
    "nvidia-sphinx-theme",
    "python-dateutil>=2.9.0",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0.0",
    "sphinx>=8.2.0,<9",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "sphinx-notfound-page>=1.1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"extensions/rapids_docs/*.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
