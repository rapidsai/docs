name: Deploy cudf-java docs
on:
  workflow_dispatch:
    inputs:
      new_stable_value:
        description: "New stable value for cudf-java"
        required: true
        default: "1"
      version:
        description: "Version being released. Format: YY.MM or YY.MM.P"
        required: true
permissions: {}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate stable switch
        env:
          NEW_STABLE_VALUE: ${{ inputs.new_stable_value }}
        run: test "${NEW_STABLE_VALUE}" = 1
  deploy:
    needs: validate
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    uses: $/.github/workflows/deploy-java-docs.yaml
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      project: cudf-java
      version: ${{ inputs.version }}
